<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>LAN Chat</title>
<style>
  :root { --bg:#0e1014; --panel:#14171d; --soft:#1b1f29; --ink:#eceef5; --muted:#8a90a6; --line:#242836; --accent:#7c6cff; --on:#2ee6a6; --danger:#ff6b8a; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f7fb; --panel:#ffffff; --soft:#eef0f7; --ink:#171a26; --muted:#6a7089; --line:#e1e4ef; --accent:#5b4bff; --danger:#d6335f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  #join { height: 100%; display: grid; place-items: center; padding: 1rem; }
  #join form { width: min(20rem, 100%); display: grid; gap: .8rem; }
  #join h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
  #join p { margin: 0; color: var(--muted); font-size: .95rem; }
  #joinErr { color: var(--danger); font-size: .85rem; min-height: 1.2rem; }
  input[type=text] { width: 100%; padding: .7rem .8rem; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  input[type=text]:focus { border-color: var(--accent); outline: none; }
  button.primary { padding: .7rem 1.1rem; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { padding: .65rem .85rem; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; }
  button.ghost:hover { border-color: var(--accent); }
  button:disabled, input:disabled { opacity: .45; cursor: not-allowed; }

  #app { height: 100%; display: none; }
  #main { display: grid; grid-template-rows: auto 1fr auto auto; height: 100%; width: 100%; max-width: 52rem; margin: 0 auto; }
  #head { display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem; border-bottom: 1px solid var(--line); }
  #head .title { flex: 1; min-width: 0; }
  #head b { display: block; line-height: 1.2; }
  #head small { display: block; color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon { position: relative; flex: none; width: 2.4rem; height: 2.4rem; border: 0; border-radius: 10px; background: transparent; font-size: 1.25rem; cursor: pointer; display: grid; place-items: center; }
  .icon:hover { background: var(--soft); }
  .icon.txt { width: auto; padding: 0 .7rem; font-size: .85rem; color: var(--muted); }
  .icon .dot { position: absolute; top: .4rem; right: .4rem; width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); }
  .icon .dot[hidden] { display: none; }

  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  #side { position: fixed; top: 0; bottom: 0; left: 0; width: min(18rem, 86vw); z-index: 11; background: var(--panel); border-right: 1px solid var(--line); padding: 1rem .6rem; overflow-y: auto; display: flex; flex-direction: column; gap: .15rem; transform: translateX(-100%); visibility: hidden; transition: transform .2s, visibility 0s .2s; }
  #app.open #scrim { opacity: 1; pointer-events: auto; }
  #app.open #side { transform: none; visibility: visible; transition: transform .2s; }
  #side h2 { margin: .9rem .6rem .3rem; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #side .me { margin-top: auto; padding: .6rem; font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); }

  .av { flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #fff; font-size: .9rem; position: relative; }
  .av.grp { background: var(--soft); color: var(--muted); font-size: .7rem; }
  .av.live::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: .65rem; height: .65rem; border-radius: 50%; background: var(--on); border: 2px solid var(--panel); }
  .item { display: flex; align-items: center; gap: .65rem; width: 100%; text-align: left; padding: .5rem .6rem; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
  .item:hover { background: var(--soft); }
  .item[aria-current=true] { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item.off { opacity: .5; }
  .item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .ip { font-size: .8rem; color: var(--muted); }
  .badge { background: var(--accent); color: #fff; font-size: .72rem; font-weight: 700; min-width: 1.3rem; text-align: center; padding: .05rem .4rem; border-radius: 999px; }

  #log { overflow-y: auto; padding: 1rem .9rem; display: flex; flex-direction: column; gap: .5rem; }
  #log.drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .row { display: flex; align-items: flex-end; gap: .5rem; }
  .row.mine { flex-direction: row-reverse; }
  .row .av { width: 1.7rem; height: 1.7rem; font-size: .75rem; }
  .msg { max-width: min(34rem, 82%); padding: .45rem .75rem; border-radius: 14px; background: var(--soft); overflow-wrap: anywhere; }
  .row.mine .msg { background: var(--accent); color: #fff; }
  .msg .meta { font-size: .72rem; opacity: .7; margin-bottom: .05rem; }
  .msg .file { display: block; color: inherit; text-decoration: none; font-weight: 600; }
  .msg a.file::before { content: "⬇ "; }
  .msg a.file:hover span { text-decoration: underline; }
  .msg div.file { opacity: .85; }
  .msg .size { font-size: .78rem; font-weight: 400; opacity: .75; }
  .sys { align-self: center; font-size: .78rem; color: var(--muted); text-align: center; }
  .sys.err { color: var(--danger); }
  .empty { margin: auto; max-width: 20rem; text-align: center; color: var(--muted); }
  #status { padding: 0 .9rem; min-height: 1.4rem; font-size: .82rem; color: var(--accent); }
  #send { display: flex; gap: .5rem; padding: .25rem .75rem .75rem; }
</style>
</head>
<body>
<section id="join">
  <form id="joinForm">
    <h1>LAN Chat</h1>
    <p>Chat and share files with other devices on your network. Everyone joins the same room automatically.</p>
    <input type="text" id="name" maxlength="24" placeholder="Your name" autocomplete="nickname" required>
    <p id="joinErr" role="alert"></p>
    <button class="primary" id="joinBtn" type="submit">Join</button>
  </form>
</section>

<section id="app">
  <div id="scrim"></div>
  <aside id="side" aria-label="Chats and people"></aside>
  <div id="main">
    <div id="head"></div>
    <div id="log" aria-live="polite"></div>
    <div id="status"></div>
    <form id="send">
      <button class="ghost" type="button" id="attach" title="Send files">Attach</button>
      <input type="file" id="picker" multiple hidden>
      <input type="text" id="text" maxlength="2000" placeholder="Write a message" autocomplete="off">
      <button class="primary" type="submit" id="go">Send</button>
    </form>
  </div>
</section>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="loadFallback()"></script>
<script>
  function loadFallback() {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
    document.head.appendChild(s);
  }
</script>
<script>
  const $ = (id) => document.getElementById(id);
  const GROUP = 'group', CHUNK = 64 * 1024, BLOCK = 8 * 1024 * 1024;
  const rid = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');

  let cid = localStorage.getItem('lanweb-cid');
  if (!/^[a-f0-9]{16}$/.test(cid || '')) { cid = rid(8); localStorage.setItem('lanweb-cid', cid); }

  function deviceLabel() {
    const ua = navigator.userAgent;
    const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Device';
    const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
    return br ? `${os} · ${br}` : os;
  }

  const me = { cid, name: '', device: deviceLabel() };
  let room = '', peer = null, isHost = false, active = GROUP, attempts = 0, SKEY = '';
  let connText = '', transferText = '';
  const convs = { [GROUP]: [] };   // conversation key (GROUP or a device's cid) -> messages
  const unread = {};
  const peers = new Map();         // cid -> { name, device, pid, conn, online }
  const conns = new Map();         // peer id -> DataConnection

  const hostId = () => `lanchat-v1-${room}`;

  $('name').value = localStorage.getItem('lanweb-name') || '';

  // Everyone behind the same router shares one public IP address. A short hash of it becomes the
  // room name, so devices on the same network find each other automatically (no code to type).
  async function networkRoom() {
    const urls = ['https://api.ipify.org?format=json', 'https://ipv4.icanhazip.com', 'https://checkip.amazonaws.com'];
    for (const u of urls) {
      try {
        const r = await fetch(u, { cache: 'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined });
        const t = (await r.text()).trim();
        const ip = u.includes('ipify') ? JSON.parse(t).ip : t;
        if (!/^[0-9a-f.:]{7,45}$/i.test(ip)) continue;
        const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lanchat-v1|' + ip));
        return Array.from(new Uint8Array(h).slice(0, 8), (b) => b.toString(16).padStart(2, '0')).join('');
      } catch {}
    }
    return '';
  }

  function setSide(open) {
    $('app').classList.toggle('open', open);
    const m = $('menu');
    if (m) m.setAttribute('aria-expanded', String(open));
  }
  $('scrim').addEventListener('click', () => setSide(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setSide(false); });

  $('joinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (typeof Peer === 'undefined') { $('joinErr').textContent = 'Could not load the connection library. Check your internet connection and reload.'; return; }
    me.name = $('name').value.trim().slice(0, 24) || 'Guest';
    localStorage.setItem('lanweb-name', me.name);
    $('joinErr').textContent = '';
    $('joinBtn').disabled = true;
    $('joinBtn').textContent = 'Finding your network…';
    room = await networkRoom();
    $('joinBtn').disabled = false;
    $('joinBtn').textContent = 'Join';
    if (!room) { $('joinErr').textContent = 'Could not detect your network. Check your internet connection and try again.'; return; }
    SKEY = `lanweb-data-${cid}`;
    load();
    $('join').style.display = 'none';
    $('app').style.display = 'grid';
    setConn('Connecting…');
    renderAll();
    becomeHost();
  });

  // ---- Local storage history ----
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(SKEY) || '{}');
      Object.assign(convs, d.convs || {});
      if (!convs[GROUP]) convs[GROUP] = [];
      Object.entries(d.peers || {}).forEach(([id, p]) => peers.set(id, { ...p, online: false, conn: null }));
    } catch {}
  }
  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        const c = {}, p = {};
        for (const [k, v] of Object.entries(convs)) c[k] = v.filter((m) => m.type !== 'system').slice(-300).map(({ url, ...rest }) => rest);
        peers.forEach((v, id) => { p[id] = { name: v.name, device: v.device }; });
        localStorage.setItem(SKEY, JSON.stringify({ convs: c, peers: p }));
      } catch {}
    }, 300);
  }

  // ---- Connection: the first device to claim the room id is the host and introduces everyone; devices then talk directly ----
  function setConn(t) { connText = t; renderStatus(); }
  function setTransfer(t) { transferText = t; renderStatus(); }
  function renderStatus() { $('status').textContent = transferText || connText; }
  function destroyPeer() { try { peer && peer.destroy(); } catch {} conns.clear(); }

  function wirePeer(p) {
    p.on('connection', (c) => (c.metadata && c.metadata.kind === 'file' ? receiveFile(c) : setup(c)));
    p.on('disconnected', () => { try { p.reconnect(); } catch {} });
  }
  function peerError(err) {
    if (err.type === 'peer-unavailable') return;
    setConn(`Connection problem (${err.type}). Check your internet connection.`);
  }

  function becomeHost() {
    destroyPeer();
    isHost = true;
    peer = new Peer(hostId());
    wirePeer(peer);
    peer.on('open', () => { attempts = 0; setConn(''); renderHead(); });
    peer.on('error', (err) => (err.type === 'unavailable-id' ? joinAsGuest() : peerError(err)));
  }

  function joinAsGuest() {
    destroyPeer();
    isHost = false;
    peer = new Peer(`${hostId()}-${rid(4)}`);
    wirePeer(peer);
    peer.on('open', () => connectTo(hostId()));
    peer.on('error', (err) => {
      if (err.type === 'peer-unavailable' && String(err.message).trim().endsWith(hostId())) {
        // The host left while we were joining: try to take over the room.
        if (++attempts < 4) setTimeout(becomeHost, 1000 + Math.random() * 1500);
        else setConn('Could not connect. Check your internet connection.');
      } else peerError(err);
    });
  }

  function connectTo(pid) {
    if (!peer || pid === peer.id || conns.has(pid)) return;
    const c = peer.connect(pid, { reliable: true });
    setup(c);
  }

  function setup(c) {
    conns.set(c.peer, c);
    c.on('open', () => c.send({ t: 'hello', cid: me.cid, name: me.name, device: me.device, host: isHost }));
    c.on('data', (d) => onData(c, d));
    const gone = () => {
      if (conns.get(c.peer) === c) conns.delete(c.peer);
      const p = peers.get(c.__cid);
      if (p && p.conn === c) {
        p.online = false; p.conn = null;
        sys(`${p.name} left`);
        renderSide(); renderHead(); updateComposer();
      }
      // If the host disappeared, one of the remaining devices takes over the room.
      if (c.__host && !isHost) {
        setTimeout(() => {
          if (![...conns.values()].some((x) => x.__host && x.open)) becomeHost();
        }, 1000 + Math.random() * 2500);
      }
    };
    c.on('close', gone);
    c.on('error', gone);
  }

  function onData(c, d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'hello') {
      if (d.cid === me.cid || !/^[a-f0-9]{16}$/.test(String(d.cid))) { c.close(); return; }
      c.__cid = d.cid;
      c.__host = !!d.host;
      const wasOnline = (peers.get(d.cid) || {}).online;
      const name = String(d.name || 'Guest').slice(0, 24);
      peers.set(d.cid, { name, device: String(d.device || '').slice(0, 40), pid: c.peer, conn: c, online: true });
      if (!wasOnline) sys(`${name} joined`);
      if (c.__host) { attempts = 0; setConn(''); }
      if (isHost && !d.host) {
        c.send({ t: 'peers', list: [...peers.values()].filter((p) => p.online && p.conn !== c).map((p) => p.pid) });
      }
      renderSide(); renderHead(); updateComposer(); save();
      return;
    }
    if (!c.__cid) return;
    const from = peers.get(c.__cid);

    if (d.t === 'peers' && c.__host && Array.isArray(d.list)) {
      d.list.slice(0, 50).forEach((pid) => typeof pid === 'string' && connectTo(pid));
    } else if (d.t === 'msg') {
      if (d.to && d.to !== me.cid) return;
      const text = String(d.text || '').slice(0, 2000);
      if (!text) return;
      addMsg(d.to ? c.__cid : GROUP, { type: 'msg', from: from.name, fromId: c.__cid, to: d.to || null, text, time: Number(d.time) || Date.now() });

    }
  }

  // ---- Avatars, sidebar, header ----
  function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
  function avatar(id, name, live) {
    const a = document.createElement('span');
    a.className = 'av' + (live ? ' live' : '');
    const h = hue(id);
    a.style.background = `hsl(${h} 55% 50%)`;
    a.textContent = (name || '?').trim().charAt(0).toUpperCase();
    return a;
  }
  const onlineCount = () => [...peers.values()].filter((p) => p.online).length;

  function renderSide() {
    const side = $('side');
    side.innerHTML = '';
    side.appendChild(item(GROUP, 'Everyone', onlineCount() ? `${onlineCount() + 1} here` : 'Just you', true));
    const others = [...peers.entries()].sort((a, b) => (b[1].online - a[1].online) || a[1].name.localeCompare(b[1].name));
    if (others.length) { const h = document.createElement('h2'); h.textContent = 'People'; side.appendChild(h); }
    others.forEach(([id, p]) => side.appendChild(item(id, p.name, p.online ? p.device : 'offline', p.online)));
    const you = document.createElement('div');
    you.className = 'me';
    you.textContent = `You: ${me.name} · ${me.device}`;
    side.appendChild(you);
  }

  function item(key, name, sub, online) {
    const b = document.createElement('button');
    b.className = 'item' + (online ? '' : ' off');
    b.setAttribute('aria-current', key === active);
    let av;
    if (key === GROUP) { av = document.createElement('span'); av.className = 'av grp'; av.textContent = 'All'; }
    else av = avatar(key, name, online);
    b.appendChild(av);
    const t = document.createElement('span');
    t.className = 'txt';
    t.innerHTML = '<span class="name"></span><span class="ip"></span>';
    t.querySelector('.name').textContent = name;
    t.querySelector('.ip').textContent = sub;
    b.appendChild(t);
    if (unread[key]) { const n = document.createElement('span'); n.className = 'badge'; n.textContent = unread[key]; b.appendChild(n); }
    b.onclick = () => { active = key; unread[key] = 0; setSide(false); renderAll(); };
    return b;
  }

  function renderHead() {
    const h = $('head');
    h.innerHTML = '<button class="icon" id="menu" type="button" aria-label="Show chats and people" aria-expanded="false">☰<i class="dot" hidden></i></button><div class="title"><b></b><small></small></div><button class="icon txt" id="clear" type="button">Clear</button>';
    const [t, s] = [h.querySelector('b'), h.querySelector('small')];
    if (active === GROUP) {
      t.textContent = 'Everyone';
      const names = [...peers.values()].filter((p) => p.online).map((p) => p.name);
      s.textContent = names.length ? ['You', ...names].join(', ') : 'Waiting for other devices';
    } else {
      const p = peers.get(active) || { name: 'Unknown', device: '', online: false };
      t.textContent = p.name;
      s.textContent = p.online ? `${p.device} · private chat` : 'Offline';
    }
    h.querySelector('.dot').hidden = !Object.entries(unread).some(([k, v]) => v && k !== active);
    $('menu').setAttribute('aria-expanded', String($('app').classList.contains('open')));
    $('menu').onclick = () => setSide(!$('app').classList.contains('open'));
    $('clear').onclick = () => {
      if (!confirm('Delete this chat from this browser?')) return;
      convs[active] = [];
      save(); renderAll();
    };
  }

  function updateComposer() {
    const off = active !== GROUP && !(peers.get(active) || {}).online;
    ['text', 'go', 'attach'].forEach((id) => ($(id).disabled = off));
    $('text').placeholder = off ? 'This device is offline' : 'Write a message';
  }

  function renderAll() {
    renderSide(); renderHead(); updateComposer(); renderStatus();
    $('log').innerHTML = '';
    (convs[active] || []).forEach(appendMsg);
    if (active === GROUP && !onlineCount() && !(convs[GROUP] || []).some((m) => m.type !== 'system')) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Waiting for other devices. Open this page on another device on the same network and join.';
      $('log').appendChild(e);
    }
    $('log').scrollTop = $('log').scrollHeight;
  }

  // ---- Messages ----
  function sys(text) {
    const m = { type: 'system', text, time: Date.now() };
    convs[GROUP].push(m);
    if (active === GROUP) appendMsg(m);
  }

  function addMsg(key, m) {
    (convs[key] = convs[key] || []).push(m);
    if (key === active) appendMsg(m);
    else { unread[key] = (unread[key] || 0) + 1; renderSide(); renderHead(); }
    save();
  }

  function appendMsg(m) {
    const log = $('log');
    const empty = log.querySelector('.empty');
    if (empty) empty.remove();
    const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    let el;
    if (m.type === 'system') {
      el = document.createElement('div');
      el.className = 'sys'; el.textContent = m.text;
    } else {
      const mine = m.fromId === me.cid;
      el = document.createElement('div');
      el.className = 'row' + (mine ? ' mine' : '');
      const bubble = document.createElement('div');
      bubble.className = 'msg';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${mine ? 'You' : m.from} · ${new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      const body = document.createElement('div');
      if (m.type === 'file') {
        const wrap = m.url ? document.createElement('a') : document.createElement('div');
        wrap.className = 'file';
        if (m.url) { wrap.href = m.url; wrap.setAttribute('download', m.name); }
        const w = document.createElement('span');
        const n = document.createElement('span'); n.textContent = m.name;
        const s = document.createElement('div'); s.className = 'size';
        s.textContent = fmtSize(m.size) + (m.url ? '' : ' · file is not kept after the page is closed');
        w.append(n, s); wrap.appendChild(w);
        body.appendChild(wrap);
      } else {
        body.textContent = m.text;
      }
      bubble.append(meta, body);
      if (!mine) el.appendChild(avatar(m.fromId, m.from));
      el.appendChild(bubble);
    }
    log.appendChild(el);
    if (stick || m.fromId === me.cid) log.scrollTop = log.scrollHeight;
  }

  function note(text, isErr) {
    const el = document.createElement('div');
    el.className = 'sys' + (isErr ? ' err' : '');
    el.textContent = text;
    $('log').appendChild(el);
    $('log').scrollTop = $('log').scrollHeight;
  }

  // Live connections for a conversation: one device for a private chat, everyone for the group.
  function targets(to) {
    const list = to ? [peers.get(to)] : [...peers.values()];
    return list.filter((p) => p && p.online && p.conn && p.conn.open);
  }

  $('send').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    const to = active === GROUP ? null : active;
    const live = targets(to);
    if (to && !live.length) { note('That device is offline. Message not delivered.', true); return; }
    const time = Date.now();
    live.forEach((p) => p.conn.send({ t: 'msg', to, text, time }));
    addMsg(active, { type: 'msg', from: me.name, fromId: me.cid, to, text, time });
    $('text').value = '';
  });

  // ---- Files: sent in chunks straight to the other device(s) ----
  $('attach').onclick = () => $('picker').click();
  $('picker').onchange = (e) => { sendFiles([...e.target.files]); e.target.value = ''; };
  ['dragover', 'dragenter'].forEach((t) => $('log').addEventListener(t, (e) => { e.preventDefault(); $('log').classList.add('drop'); }));
  ['dragleave', 'drop'].forEach((t) => $('log').addEventListener(t, () => $('log').classList.remove('drop')));
  $('log').addEventListener('drop', (e) => {
    e.preventDefault();
    if (!$('attach').disabled) sendFiles([...e.dataTransfer.files]);
  });

  // Each file travels on its own raw data channel (no packing), written straight to the browser's
  // channel with back-pressure, in 64 KB pieces. This is much faster than sending through PeerJS messages.
  function sendFileTo(p, f, to, onProgress) {
    return new Promise((resolve, reject) => {
      const c = peer.connect(p.pid, { serialization: 'raw', reliable: true, metadata: { kind: 'file', name: f.name, size: f.size, to } });
      const timer = setTimeout(() => { c.close(); reject(new Error('timeout')); }, 15000);
      c.on('error', reject);
      c.on('open', async () => {
        clearTimeout(timer);
        const rtc = c.dataChannel;
        rtc.bufferedAmountLowThreshold = 1 << 20;
        const low = () => new Promise((r) => rtc.addEventListener('bufferedamountlow', r, { once: true }));
        try {
          let sent = 0;
          for (let off = 0; off < f.size; off += BLOCK) {
            const block = await f.slice(off, off + BLOCK).arrayBuffer();
            for (let i = 0; i < block.byteLength; i += CHUNK) {
              if (rtc.readyState !== 'open') throw new Error('closed');
              if (rtc.bufferedAmount > 8 << 20) await low();
              const view = new Uint8Array(block, i, Math.min(CHUNK, block.byteLength - i));
              rtc.send(view);
              sent += view.byteLength;
              onProgress(Math.max(0, sent - rtc.bufferedAmount));
            }
          }
          while (rtc.bufferedAmount > 0 && rtc.readyState === 'open') await new Promise((r) => setTimeout(r, 50));
          if (c.open) await new Promise((r) => { c.on('close', r); setTimeout(r, 5000); });
          c.close();
          resolve();
        } catch (e) { c.close(); reject(e); }
      });
    });
  }

  function receiveFile(c) {
    const meta = c.metadata || {};
    const entry = [...peers.entries()].find(([, p]) => p.pid === c.peer);
    const name = String(meta.name || 'file').slice(0, 150);
    const size = Number(meta.size) || 0;
    const to = meta.to || null;
    if (!entry || !size || (to && to !== me.cid)) { c.close(); return; }
    const [fromCid, from] = entry;
    const parts = [];
    let got = 0, last = 0, done = false;
    c.on('data', (buf) => {
      if (done || !(buf instanceof ArrayBuffer || ArrayBuffer.isView(buf))) return;
      parts.push(buf);
      got += buf.byteLength;
      const now = Date.now();
      if (now - last > 150 && got < size) { last = now; setTransfer(`Receiving ${name}… ${Math.round((got / size) * 100)}%`); }
      if (got >= size) {
        done = true;
        setTransfer('');
        addMsg(to ? fromCid : GROUP, { type: 'file', from: from.name, fromId: fromCid, to, name, size: got, time: Date.now(), url: URL.createObjectURL(new Blob(parts)) });
        setTimeout(() => c.close(), 300);
      }
    });
    c.on('close', () => { if (!done) { setTransfer(''); note(`Receiving ${name} was interrupted.`, true); } });
  }

  async function sendFiles(files) {
    const key = active, to = active === GROUP ? null : active;
    for (const f of files) {
      if (!f.size) { note(`${f.name} is empty and was skipped.`, true); continue; }
      const live = targets(to);
      if (!live.length) { note(to ? 'That device is offline.' : 'Nobody else is here yet.', true); break; }
      let last = 0;
      const progress = (n) => {
        const now = Date.now();
        if (now - last > 150) { last = now; setTransfer(`Sending ${f.name}… ${Math.round((n / f.size) * 100)}%`); }
      };
      const results = await Promise.allSettled(live.map((p, i) => sendFileTo(p, f, to, i === 0 ? progress : () => {})));
      results.forEach((r, i) => { if (r.status === 'rejected') note(`Could not send ${f.name} to ${live[i].name}.`, true); });
      if (results.some((r) => r.status === 'fulfilled')) {
        addMsg(key, { type: 'file', from: me.name, fromId: me.cid, to, name: f.name, size: f.size, time: Date.now(), url: URL.createObjectURL(f) });
      }
    }
    setTransfer('');
  }

  function fmtSize(n) {
    if (n < 1024) return `${n} B`;
    const u = ['KB', 'MB', 'GB']; let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < 2);
    return `${n.toFixed(n < 10 ? 1 : 0)} ${u[i]}`;
  }
</script>
</body>
